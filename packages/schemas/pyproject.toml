[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarflow-schemas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/scholarflow_schemas"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
