[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campusiq-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "campusiq-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/campusiq_api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
